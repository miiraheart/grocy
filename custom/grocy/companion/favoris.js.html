<script>
(function () {
	if (!window.GC) return;

	function star(on) {
		return $('<button type="button" class="gc-star"></button>').attr({ "aria-pressed": on ? "true" : "false", title: GL.t(on ? "fav.remove" : "fav.add") })
			.append($("<i></i>").attr("class", on ? "fa-solid fa-star" : "fa-regular fa-star"));
	}

	/// Recipes keep their own favori userfield; products use the per list memory above.
	GC.setFavori = function (entity, id, on) {
		var body = {};
		body.favori = on ? "1" : "";
		return GC.api("PUT", "userfields/" + entity + "/" + id, body);
	};

	function section($p, title, sub) {
		var $s = $('<section class="gc-card"></section>').appendTo($p);
		var $h = $('<div class="gc-card-hd"></div>').appendTo($s);
		$("<h3></h3>").text(title).appendTo($h);
		if (sub) $('<span class="gc-sub"></span>').text(sub).appendTo($h);
		return $s;
	}

	GC.favoris = function ($p) {
		$p.html('<div class="gc-loading"><i class="fa-solid fa-spinner fa-spin"></i> </div>').find(".gc-loading").append(document.createTextNode(GL.t("loading")));
		Promise.all([
			GC.api("GET", "objects/products?query[]=active=1&order=name:asc"),
			GC.api("GET", "objects/recipes?query[]=type=normal&order=name:asc"),
			GC.api("GET", "objects/shopping_lists"),
			GC.api("GET", "objects/shopping_list")
		]).then(function (r) {
			$p.empty();
			renderProducts($p, r[0], r[2], r[3]);
			renderRecipes($p, r[1]);
			renderLists($p, r[2], r[3]);
		}, function (err) { $p.html('<div class="gc-note gc-note-err"></div>').find(".gc-note").text(err.message); });
	};

	/// Per list favorites (D-05, D-24): the product's al_memory lists[listId].fav, the same JSON iOS reads.
	function renderProducts($p, products, lists, items) {
		var listId = +(localStorage.getItem("gc.shop.list") || (lists[0] || {}).id || GC.IDS.shoppingList);
		var fav = function (p) { return !!((((GC.shop.json((p.userfields || {}).al_memory) || {}).lists) || {})[listId] || {}).fav; };
		var favs = products.filter(fav);
		var $s = section($p, GL.t("fav.products"), GL.t("fav.nProducts", { n: favs.length }));
		var $tools = $('<div class="gc-inline"></div>').appendTo($s);
		var $list = $('<select class="form-control gc-list-select"></select>').attr("aria-label", GL.t("shop.lists")).appendTo($tools);
		lists.forEach(function (l) { $list.append($("<option></option>").val(l.id).text(l.name).prop("selected", +l.id === listId)); });
		$list.on("change", function () { try { localStorage.setItem("gc.shop.list", $list.val()); } catch (e) { /* private mode */ } GC.favoris($p); });
		var $pick = $('<input class="form-control" list="gc-fav-products">').attr("placeholder", GL.t("fav.pickPh")).appendTo($tools);
		var $dl = $('<datalist id="gc-fav-products"></datalist>').appendTo($tools);
		products.forEach(function (p) { if (!fav(p)) $dl.append($("<option></option>").val(p.name)); });
		var toggle = function (p, on) {
			return GC.shopEdit.setFavorite({ product_id: p.id }, listId, on).then(function () { GC.favoris($p); }, function (e) { GC.toast("error", e.message); });
		};
		$('<button type="button" class="btn btn-sm btn-primary"><i class="fa-solid fa-star"></i><span></span></button>').appendTo($tools).find("span").text(GL.t("add")).end().on("click", function () {
			var p = products.filter(function (x) { return x.name === $pick.val(); })[0];
			if (!p) { GC.toast("warning", GL.t("fav.pickWarn")); return; }
			toggle(p, true);
		});
		if (!favs.length) { $('<div class="gc-empty gc-empty-sm"></div>').text(GL.t("fav.empty")).appendTo($s); return; }
		var $ul = $('<div class="gc-list"></div>').appendTo($s);
		var list = lists.filter(function (l) { return +l.id === listId; })[0];
		favs.forEach(function (p) {
			var $r = $('<div class="gc-row gc-row-compact"></div>').appendTo($ul);
			var $m = $('<div class="gc-row-main"></div>').appendTo($r);
			$('<div class="gc-row-title"></div>').append(star(true).on("click", function () { toggle(p, false); }))
				.append($("<a></a>").attr("href", GC.url("/product/" + p.id)).text(p.name)).appendTo($m);
			var $a = $('<div class="gc-row-act"></div>').appendTo($r);
			$('<button type="button" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-cart-plus"></i><span></span></button>').appendTo($a).find("span").text(GL.t("fav.shopping")).end().on("click", function () {
				var ctx = { config: GC.shop.config(list), rows: items.filter(function (i) { return +i.shopping_list_id === listId; }), products: GC.byId(products), groups: {}, filter: null };
				GC.shop.addItem(ctx, { name: p.name, product_id: +p.id })
					.then(function () { GC.toast("success", GL.t("fav.addedTo", { name: p.name, list: list ? list.name : "" })); GC.favoris($p); }, function (e) { GC.toast("error", e.message); });
			});
		});
	}

	function renderRecipes($p, recipes) {
		recipes.sort(function (a, b) { return ((b.userfields || {}).favori === "1") - ((a.userfields || {}).favori === "1"); });
		var n = recipes.filter(function (r) { return (r.userfields || {}).favori === "1"; }).length;
		var $s = section($p, GL.t("fav.dishes"), GL.t("fav.nRecipes", { n: n }));
		if (!recipes.length) { $('<div class="gc-empty gc-empty-sm"></div>').text(GL.t("fav.noRecipes")).appendTo($s); return; }
		var $ul = $('<div class="gc-list"></div>').appendTo($s);
		recipes.forEach(function (r) {
			var on = (r.userfields || {}).favori === "1";
			var $r = $('<div class="gc-row gc-row-compact"></div>').appendTo($ul);
			var $m = $('<div class="gc-row-main"></div>').appendTo($r);
			$('<div class="gc-row-title"></div>').append(star(on).on("click", function () {
				GC.setFavori("recipes", r.id, !on).then(function () { GC.favoris($p); });
			})).append($("<a></a>").attr("href", GC.url("/recipes?recipe=" + r.id)).text(r.name)).appendTo($m);
			$('<div class="gc-row-act"></div>').append($('<a class="btn btn-sm btn-outline-secondary"><i class="fa-regular fa-calendar-plus"></i><span></span></a>').attr("href", GC.url("/mealplan")).find("span").text(GL.t("fav.plan")).end()).appendTo($r);
		});
	}

	function renderLists($p, lists, items) {
		var $s = section($p, GL.t("fav.lists"), GL.t("fav.nLists", { n: lists.length }));
		var $ul = $('<div class="gc-list"></div>').appendTo($s);
		lists.forEach(function (l) {
			var open = items.filter(function (i) { return +i.shopping_list_id === +l.id && String(i.done) !== "1"; }).length;
			var $r = $('<div class="gc-row gc-row-compact"></div>').appendTo($ul);
			$('<div class="gc-row-main"></div>').append($('<div class="gc-row-title"></div>').append($("<a></a>").attr("href", GC.url("/shoppinglist?list=" + l.id)).text(l.name)).append($('<span class="gc-pill"></span>').text(GL.t("fav.toBuy", { n: open })))).appendTo($r);
		});
		var $new = $('<div class="gc-inline"></div>').appendTo($s);
		var $name = $('<input class="form-control">').attr("placeholder", GL.t("fav.newListPh")).appendTo($new);
		$('<button type="button" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-plus"></i><span></span></button>').appendTo($new).find("span").text(GL.t("create")).end().on("click", function () {
			var name = $.trim($name.val());
			if (!name) return;
			GC.api("POST", "objects/shopping_lists", { name: name }).then(function () { GC.toast("success", GL.t("fav.listCreated", { name: name })); GC.favoris($p); }, function (e) { GC.toast("error", e.message); });
		});
	}

	GC.ceSoir = function ($p) {
		Promise.all([GC.api("GET", "recipes/fulfillment"), GC.api("GET", "objects/recipes?query[]=type=normal")]).then(function (r) {
			var names = GC.byId(r[1]);
			var list = (r[0] || []).filter(function (f) { return names[f.recipe_id]; }).sort(function (a, b) {
				return (b.need_fulfilled - a.need_fulfilled) || (b.due_score - a.due_score) || (a.missing_products_count - b.missing_products_count);
			}).slice(0, 3);
			if (!list.length) return;
			var $s = section($p, GL.t("tonight.title"), GL.t("tonight.sub"));
			var $ul = $('<div class="gc-list"></div>').appendTo($s);
			list.forEach(function (f) {
				var $r = $('<div class="gc-row gc-row-compact"></div>').appendTo($ul);
				var $t = $('<div class="gc-row-title"></div>').append($("<a></a>").attr("href", GC.url("/recipes?recipe=" + f.recipe_id)).text(names[f.recipe_id].name));
				$('<span class="gc-status"></span>').attr("data-s", +f.need_fulfilled ? "done" : "none").text(+f.need_fulfilled ? GL.t("tonight.all") : GL.t("tonight.missing", { n: f.missing_products_count })).appendTo($t);
				if (+f.due_score > 0) $('<span class="gc-status" data-s="warn"></span>').text(GL.t("tonight.dueSoon")).appendTo($t);
				$('<div class="gc-row-main"></div>').append($t).appendTo($r);
			});
		});
	};
})();
</script>
