	/// The shopping inbox rules (17-32/17-33): ItemNameParser.items, InboxParser.rules, ListRouter, InboxPlan and the

	var MAX_LINES = 200, MAX_LINE = 200, MAX_TEXT = 20000, MAX_ENTRIES = 50, MIN_CONFIDENCE = 0.7, MAX_LIST_WORDS = 5;

		"a head", "a bundle", "une botte", "un sachet", "une boite", "un paquet", "une bouteille", "une douzaine", "une tasse", "une pincee", "une poignee",
		"un pot", "une tranche", "une tete", "un bouquet"];
	var GREETINGS = ["salut", "coucou", "bonjour", "bonsoir", "hello", "hi", "hey", "merci", "merci beaucoup", "bisous", "bises", "bisou", "thanks", "thank",

	var POLITE = ["stp", "svp", "please", "plz", "merci"];

		}
		function upperFirst(s) { var c = Array.from(s)[0] || ""; return c !== c.toLowerCase() && c === c.toUpperCase(); }
		/// "lait pour Biocoop", "coton for the pharmacy list": the list part leaves the item.

		}
		function parseLine(line) {

				var name = withoutPolite(p.name);
				if (!name || isGreeting(name)) return null;

		function listShaped(item) {

		}
		/// InboxParser.rules: items and the share of lines that read as a list item.
		function rules(text) {

				var line = stripBullet(raw);
				if (!line) return;
				if (/:$/.test(line) && words(line.slice(0, -1)).length <= MAX_LIST_WORDS) { hint = line.slice(0, -1).trim(); return; }
				var colon = line.indexOf(":");
				if (colon >= 0) {

		}

		function routeWords(text) { return fold(text).split(" ").filter(function (w) { return w.length >= 3 && ROUTE_SKIP.indexOf(w) < 0; }); }
		function similar(a, b) { if (a === b) return true; var n = Math.min(6, a.length, b.length); return n >= 5 && a.slice(0, n) === b.slice(0, n); }
		function named(hint, lists) {
			var said = routeWords(hint), best = null;
			if (!said.length) return null;
			lists.forEach(function (l) {
				var name = routeWords(l.name);
				if (!name.length || !name.every(function (w) { return said.some(function (s) { return similar(s, w); }); })) return;

			});

		}
		function entryOf(ctx, pid, key, list) {

		}
		/// ListRouter.route: a list named in the text, the item's list memory, a list whose type fits, the current list.

			if (recent) return recent[0];

		}
		function typeFit(pid, lists, ctx) {
			var group = ctx.productGroup[pid], counts = {};

			Object.keys(ctx.productGroup).forEach(function (other) {
				if (+ctx.productGroup[other] !== +group || +other === +pid || !ctx.productMemory[other]) return;
				lists.forEach(function (l) { if ((ctx.productMemory[other].lists || {})[String(l.id)]) counts[l.type] = (counts[l.type] || 0) + 1; });
			});
			var ranked = Object.keys(counts).map(function (t) { return [t, counts[t]]; }).sort(function (a, b) { return b[1] - a[1]; });
			if (!ranked.length || (ranked.length > 1 && ranked[1][1] >= ranked[0][1])) return null;
			var current = lists.filter(function (l) { return +l.id === +ctx.currentListId; })[0];
			if (current && current.type === ranked[0][0]) return current.id;
			var first = lists.filter(function (l) { return l.type === ranked[0][0]; })[0];
			return first ? first.id : null;
		}

		function matchProduct(name, products) {
			var f = fold(name);
			var p = (products || []).filter(function (x) {
				if (+x.active === 0) return false;
				if (fold(x.name) === f) return true;
				return String(((x.userfields || {}).receipt_aliases) || "").split(",").map(fold).indexOf(f) >= 0;
			})[0];
			return p ? +p.id : null;
		}
		function resolveUnit(key, units) {
			var u = (units || []).filter(function (x) { return merge.canonical(x.name) === key || (x.name_plural && merge.canonical(x.name_plural) === key); })[0];
			return u ? +u.id : null;
		}
		function unitRef(line, units) {
			var u = line.quId != null ? (units || []).filter(function (x) { return +x.id === +line.quId; })[0] : null;

		}
		function keyOf(line) { return line.productId != null ? "p:" + line.productId : "t:" + fold(line.name); }
		function rowKey(r) { return r.product_id ? "p:" + r.product_id : "t:" + fold(r.note || ""); }
		function json(t) { try { return t ? JSON.parse(t) : null; } catch (e) { return null; } }

		function contributionRow(r, units, processed) {

		/// InboxPlan.build: matched, routed, summed in one text, then merged with the row already on the list.
		function plan(found, entryId, snap) {

				var same = lines.filter(function (l) { return l.listId === line.listId && keyOf(l) === key; })[0];
				if (same) {

					if (add != null) same.amount = merge.round(same.amount + add);
					same.explicit = same.explicit || line.explicit;

				}

		function moved(line, listId, entryId, snap) { return decided(Object.assign({}, line, { listId: listId }), entryId, snap); }
		/// InboxPlanLine.applyLine: what one reviewed line writes.
		function applyLine(line) {

		/// al_inbox: adds an entry (text capped); past 50 the oldest done go first, then dismissed, then new.
		function insert(doc, entry) {

			doc.entries.push(entry);

					if (idx < 0) break;

		}

			var out = {};
			((doc && doc.entries) || []).forEach(function (e) { (e.processed || []).forEach(function (id) { (out[id] = out[id] || []).push(e.id); }); });
			return out;

		}

			rules: rules, route: route, named: named, matchProduct: matchProduct, resolveUnit: resolveUnit, contributionRow: contributionRow, plan: plan,

	}

	else if (root.GC && root.GC.shop && root.GC.shop.merge && root.GCT) root.GC.shop.inbox = make(root.GC.shop.fold, root.GC.shop.merge, root.GCT.parseLine);
