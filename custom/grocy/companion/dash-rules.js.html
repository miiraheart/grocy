<script>
(function (root) {
	/// Port of the app's DueStatus, UseSoon and TodayMeals (dashboard "Use soon" and "Today" cards).
	/// tests/dashboard-cases.json is shared with the app (DashboardCasesFixtureTests.swift).
	var TOL = 0.0001, SOON_DAYS = 7, BEST_BEFORE = 1, EXPIRATION = 2, NO_DATE = "2999-12-31";
	var WINDOW = { freshDays: 3, longLifeDays: 14 }, FRESH_SHELF_LIFE = 30, SHELF_SHARE = 0.25;

	function dayMs(text) {
		var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(text || ""));
		return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null;
	}
	function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

	/// DueStatus from the earliest date and the due type: expired, bestBeforePassed, today, tomorrow, soon, fresh or noDate.
	function dueStatus(dates, dueType, today) {
		var t = dayMs(today), earliest = null;
		(Array.isArray(dates) ? dates : [dates]).forEach(function (d) {
			var day = d ? String(d).slice(0, 10) : null, ms = day && day !== NO_DATE ? dayMs(day) : null;
			if (ms != null && (earliest == null || ms < earliest)) earliest = ms;
		});
		if (earliest == null) return { kind: "noDate", days: null };
		var days = Math.round((earliest - t) / 86400000);
		if (days < 0) return { kind: +dueType === BEST_BEFORE ? "bestBeforePassed" : "expired", days: null, late: -days };
		if (days === 0) return { kind: "today", days: 0 };
		if (days === 1) return { kind: "tomorrow", days: 1 };
		return { kind: days <= SOON_DAYS ? "soon" : "fresh", days: days };
	}
	/// Red: expired or 0 to 3 days; orange: best before passed or 4 to 7 days; green: later; gray: no date.
	function tint(s) {
		if (s.kind === "expired") return "red";
		if (s.kind === "bestBeforePassed") return "orange";
		if (s.kind === "noDate") return "gray";
		return s.days <= 3 ? "red" : s.days <= SOON_DAYS ? "orange" : "green";
	}
	function isOpened(item) {
		var o = item.amount_opened != null ? item.amount_opened : item.amount_opened_aggregated;
		return num(o) > TOL;
	}
	function dueTypeOf(item) { return item.product && item.product.due_type != null ? item.product.due_type : item.due_type; }
	function itemDays(s) { return s.kind === "expired" || s.kind === "bestBeforePassed" ? -1 : s.days; }

	function positive(v) { var n = num(v); return n > 0 ? n : null; }
	/// UseSoonWindow.days: the last quarter of the shelf life (after opening when opened), capped at 3 days for fresh food
	/// (shelf life up to 30 days, or an expiration date without one) and 14 for long-life food; thawed days always count.
	function windowDays(product, opened, window) {
		var w = window || WINDOW, p = product || {};
		var shelf = (opened ? positive(p.default_best_before_days_after_open) : null) || positive(p.default_best_before_days);
		var fresh = shelf != null ? shelf <= FRESH_SHELF_LIFE : +p.due_type === EXPIRATION;
		var cap = fresh ? w.freshDays : w.longLifeDays;
		var share = shelf != null ? Math.min(cap, Math.max(1, Math.ceil(shelf * SHELF_SHARE))) : cap;
		var thawed = positive(p.default_best_before_days_after_thawing);
		return Math.max(share, thawed != null ? Math.min(cap, thawed) : 0);
	}

	/// UseSoon.items: past dates first (expired before best before passed), then the products inside their own window,
	/// opened ones measured on their opened limit, most urgent first. An opened product with no date or plenty of time stays off.
	function useSoon(volatile, stock, today, window) {
		var v = volatile || {}, openedIds = {}, seen = {}, out = [];
		(stock || []).forEach(function (i) { if (isOpened(i)) openedIds[i.product_id] = true; });
		function entry(item) {
			var s = dueStatus([item.best_before_date], dueTypeOf(item), today);
			return { productId: +item.product_id, name: item.product ? item.product.name : "", status: s, days: itemDays(s), tint: tint(s),
				opened: isOpened(item) || !!openedIds[item.product_id], canOpen: num(item.amount) - num(item.amount_opened) > TOL, item: item };
		}
		function add(e) {
			if (seen[e.productId]) return;
			seen[e.productId] = true;
			out.push(e);
		}
		(v.expired_products || []).concat(v.overdue_products || []).forEach(function (i) { add(entry(i)); });
		(v.due_products || []).concat((stock || []).filter(isOpened)).map(entry).forEach(function (e) {
			if (e.days != null && e.days <= windowDays(e.item.product, e.opened, window)) add(e);
		});
		function order(x) { return x.status.kind === "expired" ? -2 : x.status.kind === "bestBeforePassed" ? -1 : x.days == null ? Infinity : x.days; }
		return out.map(function (x, i) { return { x: x, i: i }; }).sort(function (a, b) {
			var l = order(a.x), r = order(b.x);
			return l !== r ? (l < r ? -1 : 1) : a.i - b.i;
		}).map(function (o) { return o.x; });
	}

	/// RecipeIngredientMatch.uses: per recipe, how many of the targets its lines list (the target, its parent or a child)
	/// and the summed amount.
	function ingredientUses(targets, positions, products) {
		var parentOf = {}, family = {}, seen = {}, uses = {};
		(products || []).forEach(function (p) { if (p.parent_product_id) parentOf[+p.id] = +p.parent_product_id; });
		(targets || []).forEach(function (t) {
			t = +t;
			if (family[t] == null) family[t] = t;
			var parent = parentOf[t];
			if (parent != null && family[parent] == null) family[parent] = t;
			Object.keys(parentOf).forEach(function (child) { if (parentOf[child] === t && family[child] == null) family[child] = t; });
		});
		(positions || []).forEach(function (p) {
			var target = family[+p.product_id], rid = +p.recipe_id;
			if (target == null) return;
			var u = uses[rid] = uses[rid] || { items: 0, amount: 0 }, s = seen[rid] = seen[rid] || {};
			if (!s[target]) { s[target] = true; u.items++; }
			u.amount += Math.max(num(p.amount), 0);
		});
		return uses;
	}
	/// CookSoon.suggestions: only recipes using a use-soon product, most of them first, then the largest amount,
	/// then Grocy's due score, fewest missing and name.
	function cookSoon(recipes, fulfillment, uses, limit) {
		var byId = {};
		(fulfillment || []).forEach(function (f) { if (!byId[+f.recipe_id]) byId[+f.recipe_id] = f; });
		return (recipes || []).filter(function (r) { return byId[+r.id] && uses[+r.id]; }).map(function (r) {
			return { recipe: r, fulfillment: byId[+r.id], use: uses[+r.id] };
		}).sort(function (a, b) {
			return (b.use.items - a.use.items) || (b.use.amount - a.use.amount) || (num(b.fulfillment.due_score) - num(a.fulfillment.due_score)) ||
				(num(a.fulfillment.missing_products_count) - num(b.fulfillment.missing_products_count)) || String(a.recipe.name).localeCompare(String(b.recipe.name));
		}).slice(0, limit == null ? 5 : Math.max(0, limit));
	}

	function mealName(row, recipes, names) {
		if (row.type === "recipe") { var r = recipes[row.recipe_id]; return r ? r.name : row.note; }
		if (row.type === "product") return names[row.product_id];
		return row.note;
	}
	/// TodayMeals.meals: the plan rows of the day in section order, with their section name.
	function meals(rows, day, sections, recipes, names) {
		var sec = {}, rec = {};
		(sections || []).forEach(function (s) { sec[s.id] = s; });
		(recipes || []).forEach(function (r) { rec[r.id] = r; });
		var sort = function (r) { var s = sec[r.section_id == null ? -1 : r.section_id]; return s ? num(s.sort_number) : 0; };
		return (rows || []).filter(function (r) { return String(r.day).slice(0, 10) === day; }).map(function (r, i) { return { r: r, i: i }; })
			.sort(function (a, b) { return sort(a.r) - sort(b.r) || a.i - b.i; }).map(function (o) {
				var r = o.r, name = mealName(r, rec, names || {}), s = sec[r.section_id == null ? -1 : r.section_id];
				return name ? { id: +r.id, name: name, section: s && s.name ? s.name : null, isRecipe: r.type === "recipe", done: String(r.done) === "1", row: r } : null;
			}).filter(Boolean);
	}
	function onlyFrozen(pid, entries, freezers) {
		var stocked = (entries || []).filter(function (e) { return +e.product_id === +pid && num(e.amount) > TOL; });
		return stocked.length > 0 && stocked.every(function (e) { return !!freezers[e.location_id]; });
	}
	/// TodayMeals.thaw: products of today's and tomorrow's open meals stocked only in a freezer; tomorrow's thaw tonight.
	function thaw(today, tomorrow, positions, entries, freezerIds, recipes, names) {
		var rec = {}, fz = {}, seen = {}, out = [];
		(recipes || []).forEach(function (r) { rec[r.id] = r; });
		(freezerIds || []).forEach(function (id) { fz[id] = true; });
		[[today, false], [tomorrow, true]].forEach(function (pair) {
			(pair[0] || []).filter(function (r) { return String(r.done) !== "1"; }).forEach(function (r) {
				var meal = mealName(r, rec, names || {}) || "";
				var need = r.type === "recipe" ? ((positions || {})[r.recipe_id] || []).map(function (p) { return p.product_id; }) : r.product_id ? [r.product_id] : [];
				need.forEach(function (pid) {
					if (!onlyFrozen(pid, entries, fz) || seen[pid]) return;
					seen[pid] = true;
					out.push({ productId: +pid, name: (names || {})[pid] || "", meal: meal, tomorrow: pair[1] });
				});
			});
		});
		return out.filter(function (t) { return t.name; });
	}

	var G = { dueStatus: dueStatus, tint: tint, useSoon: useSoon, windowDays: windowDays, ingredientUses: ingredientUses, cookSoon: cookSoon,
		meals: meals, thaw: thaw, isOpened: isOpened, WINDOW: WINDOW };
	if (typeof module !== "undefined" && module.exports) module.exports = G; else root.GCD = G;
})(this);
</script>
