		return name + " (" + m.word + ")" + (fr ? " : " : ": ") + reason;
	}

	/// The add path (D-38): danger needs two confirmations, avoid offers For Someone Else (guest flag) or Add Anyway,
	/// limit and info add with a caption. Resolves { add: bool, guest: bool }.
	function gate(name) {
		var category = { household: "household", personal: "personal" }[GC.shop.catalogKey ? GC.shop.catalogKey(name) : ""] || "food";
		var verdict = check(name, category);
		var text = verdict.matches.map(explain).join("\n");
		if (verdict.level === "limit" || verdict.level === "info") { toastr.info(text); return Promise.resolve({ add: true, guest: false }); }
		if (verdict.level !== "danger" && verdict.level !== "avoid") return Promise.resolve({ add: true, guest: false });
		return new Promise(function (resolve) {
			var $body = $('<div class="gc-diet-card"></div>').addClass("is-" + verdict.level);
			$('<p class="gc-diet-title"></p>').text(GL.t(verdict.level === "danger" ? "shop.diet.danger" : "shop.diet.avoid", { name: name })).appendTo($body);
			$('<p class="gc-diet-why"></p>').text(text).appendTo($body);
			var buttons = { cancel: { label: GL.t("cancel"), className: "btn-secondary", callback: function () { resolve({ add: false }); } } };
			if (verdict.level === "avoid") {
				buttons.guest = { label: GL.t("shop.diet.guest"), className: "btn-outline-primary", callback: function () { resolve({ add: true, guest: true }); } };
				buttons.add = { label: GL.t("shop.diet.addAnyway"), className: "btn-danger", callback: function () { resolve({ add: true, guest: false }); } };
			} else {
				buttons.add = { label: GL.t("shop.diet.addAnyway"), className: "btn-danger", callback: function () {
					bootbox.confirm({ message: GL.t("shop.diet.sure", { name: name }), callback: function (ok) { resolve({ add: !!ok, guest: false }); } });
				} };
			}
			bootbox.dialog({ title: GL.t("shop.diet.title"), message: $body, buttons: buttons, onEscape: function () { resolve({ add: false }); } });
		});
	}

	GC.shop.diet = { rules: RULES, version: RULES.version, check: check, gate: gate, tokens: tokens };
	GC.shop.dietRules = RULES;
})();
</script>
