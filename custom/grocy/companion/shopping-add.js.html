<script>
(function () {
	if (!window.GC || !GC.shop) return;
	var S = GC.shop, LIMIT = 8;

	/// Suggestions (SPEC 6.18): rows already on the list first, then this list's favorites and recents, then products.
	function suggestions(state, text) {
		var q = S.fold(S.parseQty(text).name), out = [], seen = {};
		if (!q) return out;
		function push(item) {
			if (seen[item.key] || out.length >= LIMIT) return;
			if (S.fold(item.name).indexOf(q) === -1) return;
			seen[item.key] = true;
			out.push(item);
		}
		state.rows.forEach(function (r) {
			push({ key: S.keyOf(r), name: S.nameOf(r, state.products), product_id: r.product_id, kind: +r.done === 1 ? "crossed" : "active" });
		});
		var cfg = state.config, memory = [];
		Object.keys(cfg.memory.items || {}).forEach(function (key) {
			var m = cfg.memory.items[key];
			if (!m.recentHidden) memory.push({ key: key, name: m.name || key.slice(2), fav: !!m.fav, at: m.recentAt || "" });
		});
		Object.keys(state.products).forEach(function (id) {
			var p = state.products[id], m = ((S.json((p.userfields || {}).al_memory) || {}).lists || {})[cfg.id];
			if (m && !m.recentHidden && (m.fav || m.recentAt)) memory.push({ key: "p:" + id, name: p.name, product_id: +id, fav: !!m.fav, at: m.recentAt || "" });
		});
		memory.sort(function (a, b) { return (b.fav - a.fav) || b.at.localeCompare(a.at); })
			.forEach(function (m) { push({ key: m.key, name: m.name, product_id: m.product_id, kind: m.fav ? "favorite" : "recent" }); });
		Object.keys(state.products).forEach(function (id) {
			var p = state.products[id];
			if (+p.active !== 0) push({ key: "p:" + id, name: p.name, product_id: +id, kind: "product" });
		});
		if (S.catalogWords && cfg.autocomplete) S.catalogWords().forEach(function (w) { push({ key: "t:" + w, name: w, kind: "catalog" }); });
		return out;
	}

	/// Every web add: the diet gate (D-38), then the no duplicate add of SPEC 6.2 step 3.
	function submit(state, draft, done) {
		var gate = S.diet ? S.diet.gate(draft.name) : Promise.resolve({ add: true });
		return gate.then(function (verdict) {
			if (!verdict.add) return null;
			draft.guest = verdict.guest;
			return S.addItem({ config: state.config, rows: state.rows, products: state.products, groups: state.groups, filter: state.filter,
				units: state.units, conversions: state.conversions }, draft)
				.then(function (result) {
					if (result.kind === "confirm") return confirm(state, result, done);
					if (result.kind !== "created") toastr.info(GL.t(result.kind === "uncrossed" ? "shop.putBack" : "shop.already", { name: draft.name }));
					done(result);
					return result;
				});
		}).catch(function (e) { toastr.error(e.message); });
	}

	function amountText(n) { return S.merge.number(n, GL.lang); }

	/// The confirm card of 17-32 (Add, Keep current, Set amount) for an item already on the list; the row is flashed after.
	function confirmCard(name, decision, caption, onChoice) {
		var d = decision, $body = $('<div class="gc-confirm"></div>');
		$('<p class="gc-confirm-now"></p>').text(GL.t("shop.dup.onList", { name: name, n: amountText(d.current) })).appendTo($body);
		if (caption) $('<p class="gc-shop-caption"></p>').text(caption).appendTo($body);
		var $set = $('<input type="number" step="any" min="0" class="form-control form-control-sm gc-confirm-set">')
			.val(d.kind === "confirm" ? d.sum : d.current).attr("aria-label", GL.t("shop.dup.set"));
		var buttons = {};
		if (d.kind === "confirm") buttons.add = { label: GL.t("shop.dup.add", { a: amountText(d.current), b: amountText(d.incoming), c: amountText(d.sum) }), className: "btn-primary",
			callback: function () { onChoice({ kind: "add" }); } };
		buttons.keep = { label: GL.t("shop.dup.keep"), className: "btn-secondary", callback: function () { onChoice({ kind: "keep" }); } };
		buttons.set = { label: GL.t("shop.dup.set"), className: "btn-outline-primary", callback: function () {
			var v = S.num($set.val());
			if (!(v > 0)) return false;
			onChoice({ kind: "set", amount: v, note: d.kind === "confirmUnconvertible" ? d.incoming : null });
		} };
		if (d.kind === "confirmUnconvertible") $('<p class="gc-note"></p>').text(GL.t("shop.dup.unconvertible", { q: d.incoming })).appendTo($body);
		$('<label class="gc-edit-field"></label>').append($("<span></span>").text(GL.t("shop.dup.set"))).append($set).appendTo($body);
		return bootbox.dialog({ title: GL.t("shop.dup.title"), message: $body, onEscape: function () { onChoice({ kind: "keep" }); }, buttons: buttons });
	}

	function confirm(state, result, done) {
		var name = S.nameOf(result.row, state.products), cap = GC.shopPage ? GC.shopPage.caption(result.row) : null;
		return new Promise(function (resolve) {
			confirmCard(name, result.decision, cap, function (choice) {
				S.resolveDuplicate(result, choice).then(function () { var r = { kind: "highlighted", id: result.id }; done(r); resolve(r); },
					function (e) { toastr.error(e.message); resolve(null); });
			});
		});
	}

	/// Typed text the app's way (ItemNameParser): several items split by commas, "et", "and"; a known unit becomes the
	/// row unit, any other unit word stays as quantity text.
	function drafts(state, text, item) {
		var parsed = S.inbox ? S.inbox.items(text) : [S.parseQty(text)];
		var units = Object.keys(state.units).map(function (id) { return state.units[id]; });
		var draft = function (name, pid, p) {
			var key = p && p.unitWord ? S.merge.canonical(p.unitWord) : null, qu = key ? S.inbox.resolveUnit(key, units) : null;
			return { name: name, product_id: pid || null, amount: p && p.amount != null ? p.amount : null, qu_id: qu,
				qtyText: (p && p.qtyText) || (qu == null && p && p.unitWord ? p.unitWord : null) };
		};
		if (item) return [draft(item.name, item.product_id, parsed[0])];
		return parsed.filter(function (p) { return p.name; }).map(function (p) { return draft(p.name, null, p); });
	}

	var ICONS = { active: "fa-list", crossed: "fa-list", favorite: "fa-star", recent: "fa-clock-rotate-left", product: "fa-box", catalog: "fa-basket-shopping" };

	function mount($box, state, done) {
		var $input = $('<input type="text" class="form-control gc-shop-input" autocomplete="off">').attr("placeholder", GL.t("shop.addItem"))
			.attr("aria-label", GL.t("shop.addItem")).appendTo($box);
		var $menu = $('<ul class="gc-shop-suggest" role="listbox"></ul>').appendTo($box).hide();
		var items = [], index = -1;

		function draw() {
			$menu.empty().toggle(items.length > 0);
			items.forEach(function (item, i) {
				$('<li role="option"></li>').toggleClass("is-selected", i === index).addClass("is-" + item.kind)
					.append($('<i class="fa-solid"></i>').addClass(ICONS[item.kind])).append($("<span></span>").text(item.name))
					.on("mousedown", function (e) { e.preventDefault(); add(item); }).appendTo($menu);
			});
		}

		function add(item) {
			var list = drafts(state, $input.val(), item);
			if (!list.length) return;
			if (list.length === 1) submit(state, list[0], done);
			else list.reduce(function (chain, d) { return chain.then(function () { d.many = true; return submit(state, d, function () {}); }); }, Promise.resolve())
				.then(function () { done(null); });
			$input.val("");
			items = []; index = -1; draw();
		}

		function newItemForm() {
			var $form = $('<form class="gc-shop-new"></form>');
			var fields = [["name", "shop.name"], ["note", "shop.note"], ["qty", "shop.quantity"]].map(function (f) {
				return $('<input type="text" class="form-control form-control-sm">').attr("name", f[0]).attr("placeholder", GL.t(f[1])).appendTo($form);
			});
			fields[0].val($input.val());
			$('<button type="submit" class="btn btn-sm btn-primary"></button>').text(GL.t("add")).appendTo($form);
			$form.on("submit", function (e) {
				e.preventDefault();
				var q = S.parseQty(fields[2].val() + " x");
				var draft = { name: fields[0].val().trim(), note: fields[1].val().trim(), amount: q.amount, unit: q.unit === "x" ? null : q.unit };
				if (!draft.name) return;
				submit(state, draft, done);
			});
			$box.find(".gc-shop-new").remove();
			$box.append($form);
			fields[0].trigger("focus");
		}

		$input.on("input", function () { items = suggestions(state, $input.val()); index = items.length ? 0 : -1; draw(); });
		$input.on("keydown", function (e) {
			if (e.key === "ArrowDown" || e.key === "ArrowUp") {
				e.preventDefault();
				if (!items.length) return;
				index = (index + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
				draw();
			} else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
				e.preventDefault();
				newItemForm();
			} else if (e.key === "Enter") {
				e.preventDefault();
				add(index >= 0 && S.fold(items[index].name) === S.fold(S.parseQty($input.val()).name) || index > 0 ? items[index] : null);
			} else if (e.key === "Escape") {
				items = []; draw(); $input.trigger("blur");
			}
		});
		$input.on("blur", function () { setTimeout(function () { $menu.hide(); }, 150); });
	}

	GC.shopAdd = { mount: mount, suggestions: suggestions, submit: submit, confirmCard: confirmCard, drafts: drafts };
})();
</script>
