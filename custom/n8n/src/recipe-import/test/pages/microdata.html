<!doctype html>
<html lang="en"><head><title>Banana bread - Home Kitchen</title></head>
<body>
<nav><a href="/">Home</a></nav>
<article itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Banana bread</h1>
  <p>Makes <span itemprop="recipeYield">8 slices</span></p>
  <ul>
    <li itemprop="recipeIngredient">3 ripe bananas</li>
    <li itemprop="recipeIngredient">1 1/2 cups flour</li>
    <li itemprop="recipeIngredient">1/2 cup (100 g) sugar</li>
    <li itemprop="recipeIngredient">1 tsp baking soda</li>
  </ul>
  <div itemprop="recipeInstructions">
    <ol><li>Mash the bananas.</li><li>Stir in the flour, sugar and soda.</li><li>Bake 60 minutes at 175&deg;C.</li></ol>
  </div>
</article>
</body></html>
